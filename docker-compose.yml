services:
  offdeck:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your public HTTPS URL}"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    logging:
      driver: local
